services:
  db:
    image: public.ecr.aws/docker/library/postgres:16
    environment:
      POSTGRES_USER: adplatform
      POSTGRES_PASSWORD: adplatform
      POSTGRES_DB: adplatform
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  backend:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://adplatform:adplatform@db:5432/adplatform
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: media
      MINIO_PUBLIC_URL: http://localhost:9000
      JWT_SECRET: supersecret
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  pgdata:
  miniodata: